name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,app,docs]"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: SHACL validation and generated files
        run: make validate
      - name: Build the documentation
        run: make docs
