[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semlab"
version = "0.1.0"
description = "EU Data Governance Semantic Lab: a small linked data stack about EU data and AI regulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reza Tashakkori" }]
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "owlrl>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
app = [
    "streamlit>=1.40",
    "pyvis>=0.3.2",
]
docs = [
    "pylode>=3.0",
    "kurra==3.0.5",  # newer kurra versions break pyLODE (get_missing_labels was removed)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E501"]  # long lines of readable prose in the UI
"tests/*" = ["E501"]
